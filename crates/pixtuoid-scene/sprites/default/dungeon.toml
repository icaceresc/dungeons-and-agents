# A dungeon: every campaign floor below the camp (`FloorRole::Dungeon`).
# build.rs lays this over pack.toml as it lays camp.toml, so it names only what
# the dungeon redraws, under the office's own names. Its sprites are
# scripts/gen-art.py's `dungeon_*`, registered here by hand, each on the canvas
# of the piece it stands in for.

[walls]
windows = false

# The dungeon's materials: rock, a monster's hide, a spider's chitin, bone and
# a torch's flame.
[palette]
"ɢ" = "#4a4540"   # rough stone: a boulder, the stair arch's blocks
"ɐ" = "#5d7236"   # an orc's hide
"ɔ" = "#4a3f58"   # a giant spider's chitin
"ɘ" = "#d4c9a8"   # bone: a tusk, a fang, a skull
"ɤ" = "#8a9636"   # a goblin's hide, yellower than an orc's
"ɛ" = "#e0702c"   # a torch's flame round its bulb-key core

[ramps]
"ɣ" = { of = "ɢ", level = 2 }    # stone, lit
"ɦ" = { of = "ɢ", level = 4 }    # stone, its brightest edge
"ɧ" = { of = "ɢ", level = -2 }   # stone, shaded
"ɨ" = { of = "ɢ", level = -5 }   # stone, a crack or a deep step
"ɑ" = { of = "ɐ", level = 2 }    # hide, lit
"ɒ" = { of = "ɐ", level = -2 }   # hide, shaded
"ɓ" = { of = "ɐ", level = -5 }   # hide, darkest: a brow, a mouth
"ɕ" = { of = "ɔ", level = 2 }    # chitin, lit
"ɖ" = { of = "ɔ", level = 5 }    # chitin, a glint
"ɗ" = { of = "ɔ", level = -2 }   # chitin, shaded: the legs' far segments
"ə" = { of = "ɘ", level = -2 }   # bone, shaded
"ɚ" = { of = "ɘ", level = -5 }   # bone, darkest
"ɜ" = { of = "ɛ", level = -3 }   # flame, its dark red tips
"ɥ" = { of = "ɤ", level = 2 }    # goblin hide, lit
"ɯ" = { of = "ɤ", level = -2 }   # goblin hide, shaded

# The lairs, each on its desk's own canvas: empty, keeping the desk's `cup`
# and `tower` marks and a torch whose flame burns in the bulb key.
[animations."desk@4x"]
frames = ["dungeon_desk@4x.sprite"]

[animations."desk_north@4x"]
frames = ["dungeon_desk_north@4x.sprite"]

[animations."desk_front@4x"]
frames = ["dungeon_desk_front@4x.sprite"]

# Its foes, drawn on its lair's canvas only while the seat's sitter works:
# `foe` under the sitter's props (a goblin), `foe_front` over them (an orc),
# `foe_north` at the back-turned seat's lair (a giant spider). Their eyes or
# sigils in the screen keys, so the fighter's tool lights them. pack.toml has
# no `@4x` of these to merge into, so each names its base's `frame_ms`.
[animations."foe@4x"]
frames = ["dungeon_foe@4x.sprite"]
frame_ms = 600

[animations."foe_front@4x"]
frames = ["dungeon_foe_front@4x.sprite"]
frame_ms = 600

[animations."foe_north@4x"]
frames = ["dungeon_foe_north@4x.sprite"]
frame_ms = 600

[animations."desk_chair@4x"]
frames = ["dungeon_desk_chair@4x.sprite"]

[animations."desk_cup@4x"]
frames = ["dungeon_desk_cup@4x.sprite"]

[animations."token_tower@4x"]
frames = ["dungeon_token_tower@4x.sprite"]

[animations."token_sheet@4x"]
frames = ["dungeon_token_sheet@4x.sprite"]

[animations."door@4x"]
frames = ["dungeon_door@4x.sprite"]

# Seated and waiting on its user: sounding a war horn under the `!`.
[animations."seated@4x"]
frames = ["dungeon_seated@4x.sprite"]

[animations."seated_back@4x"]
frames = ["dungeon_seated_back@4x.sprite"]

