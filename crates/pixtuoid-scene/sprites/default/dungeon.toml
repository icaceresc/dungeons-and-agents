# A dungeon: every campaign floor below the camp (`FloorRole::Dungeon`).
# build.rs lays this over pack.toml as it lays camp.toml, so it names only what
# the dungeon redraws, under the office's own names. Its sprites are
# scripts/gen-art.py's `dungeon_*`, registered here by hand, each on the canvas
# of the piece it stands in for.

[walls]
windows = false

# The dungeon's materials: rock, a monster's hide, a spider's chitin, bone and
# a torch's flame.
[palette]
"ɢ" = "#4a4540"   # rough stone: a boulder, the stair arch's blocks
"ɐ" = "#5d7236"   # an orc's hide
"ɔ" = "#4a3f58"   # a giant spider's chitin
"ɘ" = "#d4c9a8"   # bone: a tusk, a fang, a skull
"ɛ" = "#e0702c"   # a torch's flame round its bulb-key core

[ramps]
"ɣ" = { of = "ɢ", level = 2 }    # stone, lit
"ɦ" = { of = "ɢ", level = 4 }    # stone, its brightest edge
"ɧ" = { of = "ɢ", level = -2 }   # stone, shaded
"ɨ" = { of = "ɢ", level = -5 }   # stone, a crack or a deep step
"ɑ" = { of = "ɐ", level = 2 }    # hide, lit
"ɒ" = { of = "ɐ", level = -2 }   # hide, shaded
"ɓ" = { of = "ɐ", level = -5 }   # hide, darkest: a brow, a mouth
"ɕ" = { of = "ɔ", level = 2 }    # chitin, lit
"ɖ" = { of = "ɔ", level = 5 }    # chitin, a glint
"ɗ" = { of = "ɔ", level = -2 }   # chitin, shaded: the legs' far segments
"ə" = { of = "ɘ", level = -2 }   # bone, shaded
"ɚ" = { of = "ɘ", level = -5 }   # bone, darkest
"ɜ" = { of = "ɛ", level = -3 }   # flame, its dark red tips

# The lairs, each on its desk's own canvas: empty, keeping the desk's `cup`
# and `tower` marks and a torch whose flame burns in the bulb key.
# PLACEHOLDERS until the lair art lands: the empty lairs are cut from
# gen-art's lair helpers, and the foes are the whole monster lairs.
[animations."desk@4x"]
frames = ["dungeon_lair_placeholder@4x.sprite"]

[animations."desk_north@4x"]
frames = ["dungeon_lair_north_placeholder@4x.sprite"]

[animations."desk_front@4x"]
frames = ["dungeon_lair_front_placeholder@4x.sprite"]

# Its foe, drawn on its lair's canvas only while the seat's sitter works:
# `foe` under the sitter's props, `foe_front` over them, `foe_north` at the
# back-turned seat's lair. Its eyes or sigil in the screen keys, so the
# fighter's tool lights them. pack.toml has no `@4x` of these to merge into,
# so each names its base's `frame_ms`.
[animations."foe@4x"]
frames = ["dungeon_desk@4x.sprite"]
frame_ms = 600

[animations."foe_front@4x"]
frames = ["dungeon_desk_front@4x.sprite"]
frame_ms = 600

[animations."foe_north@4x"]
frames = ["dungeon_desk_north@4x.sprite"]
frame_ms = 600

[animations."desk_chair@4x"]
frames = ["dungeon_desk_chair@4x.sprite"]

[animations."desk_cup@4x"]
frames = ["dungeon_desk_cup@4x.sprite"]

[animations."token_tower@4x"]
frames = ["dungeon_token_tower@4x.sprite"]

[animations."token_sheet@4x"]
frames = ["dungeon_token_sheet@4x.sprite"]

[animations."door@4x"]
frames = ["dungeon_door@4x.sprite"]

# Seated and waiting on its user: sounding a war horn under the `!`.
[animations."seated@4x"]
frames = ["dungeon_seated@4x.sprite"]

[animations."seated_back@4x"]
frames = ["dungeon_seated_back@4x.sprite"]

# The furnishings, each on the office piece's canvas: a barrel, cave
# growths and bones for the pot plants, a wall torch, a brazier, a
# treasure chest, a weapon rack, a map and boards of wanted posters.
[animations."filing_cabinet@4x"]
frames = ["dungeon_filing_cabinet@4x.sprite"]

[animations."plant@4x"]
frames = ["dungeon_plant@4x.sprite"]

[animations."plant_tall@4x"]
frames = ["dungeon_plant_tall@4x.sprite"]

[animations."plant_flower@4x"]
frames = ["dungeon_plant_flower@4x.sprite"]

[animations."plant_succulent@4x"]
frames = ["dungeon_plant_succulent@4x.sprite"]

[animations."exit_sign@4x"]
frames = ["dungeon_exit_sign@4x.sprite"]

[animations."printer@4x"]
frames = ["dungeon_printer@4x.sprite"]

[animations."vending_machine@4x"]
frames = ["dungeon_vending_machine@4x.sprite"]

[animations."bookshelf@4x"]
frames = ["dungeon_bookshelf@4x.sprite"]

[animations."whiteboard@4x"]
frames = ["dungeon_whiteboard@4x.sprite"]

[animations."bulletin_board@4x"]
frames = ["dungeon_bulletin_board@4x.sprite"]

[animations."notice_board@4x"]
frames = ["dungeon_notice_board@4x.sprite"]

# The floor indicator's arrows as flights of stairs. `alert` writes the up
# arrow's glyph, and a glyph draws one art (`display::icon`'s tests).
[icons]
alert = "dungeon_icon_floor_up.sprite"
floor_up = "dungeon_icon_floor_up.sprite"
floor_down = "dungeon_icon_floor_down.sprite"
