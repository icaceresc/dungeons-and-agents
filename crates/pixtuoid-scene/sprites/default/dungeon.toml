# The floor indicator's arrows as flights of stairs. `alert` writes the up
# arrow's glyph, and a glyph draws one art (`display::icon`'s tests).
[icons]
alert = "dungeon_icon_floor_up.sprite"
floor_up = "dungeon_icon_floor_up.sprite"
floor_down = "dungeon_icon_floor_down.sprite"
